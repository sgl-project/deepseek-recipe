name: Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested artifacts to TestPyPI, then to PyPI once the pypi environment approves
        type: boolean
        default: false
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/wheels.yml
      - .github/scripts/**
      - deepseek-recipe-python/Cargo.toml
      - deepseek-recipe-python/build.rs
      - deepseek-recipe-python/pyproject.toml

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          pip install 'maturin>=1.9,<2' 'twine>=7'
          maturin sdist --manifest-path deepseek-recipe-python/Cargo.toml --out wheelhouse
          twine check --strict wheelhouse/*
      - name: Build a wheel from the sdist
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev
          prefix=$HOME/opencv-min
          .github/scripts/build-opencv.sh "$prefix"
          rustup toolchain install
          RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1) \
          OPENCV_INCLUDE_PATHS=$prefix/include/opencv4 \
          OPENCV_LINK_PATHS=$prefix/lib \
          OPENCV_LINK_LIBS=opencv_core,opencv_imgproc,opencv_imgcodecs \
            pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" wheelhouse/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: wheelhouse/
          if-no-files-found: error

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: manylinux_2_28_x86_64, runner: ubuntu-24.04 }
          - { platform: manylinux_2_28_aarch64, runner: ubuntu-24.04-arm }
          - { platform: macosx_11_0_arm64, runner: macos-15 }
          - { platform: macosx_11_0_x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build in quay.io/pypa/${{ matrix.platform }}
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          "quay.io/pypa/${{ matrix.platform }}"
          .github/scripts/build-wheel.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: Build
        if: runner.os == 'macOS'
        run: .github/scripts/build-wheel.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: wheelhouse/
          if-no-files-found: error

  test:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        target:
          - { platform: manylinux_2_28_x86_64, runner: ubuntu-24.04 }
          - { platform: manylinux_2_28_aarch64, runner: ubuntu-24.04-arm }
          - { platform: macosx_11_0_arm64, runner: macos-15 }
          - { platform: macosx_11_0_x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target.platform }}
          path: wheelhouse
      - name: Install the wheel and run the binding tests
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --no-index --only-binary :all: --find-links wheelhouse sgl-deepseek-recipe
          pip install 'pytest>=8,<10'
          python - <<'EOF'
          import importlib.metadata
          import deepseek_recipe

          version = importlib.metadata.version("sgl-deepseek-recipe")
          assert deepseek_recipe.__version__ == version, (deepseek_recipe.__version__, version)
          assert "site-packages" in deepseek_recipe.__file__, deepseek_recipe.__file__
          print(version, deepseek_recipe.__file__)
          EOF
          python -m pytest deepseek-recipe-python/tests -q

  manifest:
    needs: [sdist, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release/dist
      - name: Record hashes and source revisions
        run: |
          git fetch --no-tags https://github.com/deepseek-ai/deepseek-recipe.git main
          python3 .github/scripts/release-manifest.py release \
            --source-sha "$(git rev-parse HEAD)" \
            --upstream-main-sha "$(git rev-parse FETCH_HEAD)" \
            --upstream-base-sha "$(git merge-base HEAD FETCH_HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  testpypi:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/sgl-v'))
    needs: manifest
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sgl-deepseek-recipe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify hashes
        working-directory: release/dist
        run: sha256sum --check --strict ../SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sgl-deepseek-recipe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify hashes
        working-directory: release/dist
        run: sha256sum --check --strict ../SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
